[tool.poetry]
name = "mcp-guardeval"
version = "0.2.0"
description = "Evaluate MCP-based LLM agents for task success and security resilience. Configurable attack catalog, OpenTelemetry trace analysis, and pytest integration."
authors = ["Jeneesh Surani <jeneeshsurani@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "agenteval" },
]
keywords = ["mcp", "langgraph", "agent-evaluation", "llm-security", "opentelemetry", "guardrails", "red-team"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.urls]
Homepage = "https://github.com/Jeneesh1014/safe-mcp-agent"
Repository = "https://github.com/Jeneesh1014/safe-mcp-agent"
"Bug Tracker" = "https://github.com/Jeneesh1014/safe-mcp-agent/issues"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
opentelemetry-sdk = "^1.25"
opentelemetry-api = "^1.25"
pytest = "^8.2"          # runtime dep — plugin hooks require pytest to be importable

[tool.poetry.plugins."pytest11"]
agenteval = "agenteval.plugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
