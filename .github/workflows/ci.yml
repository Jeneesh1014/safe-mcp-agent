name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev deps
        run: |
          pip install black isort flake8

      - name: black --check
        run: black --check .

      - name: isort --check
        run: isort --check-only --profile black .

      - name: flake8
        run: flake8 .

  test:
    name: Unit tests (no LLM)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install pytest pytest-asyncio pydantic mcp python-dotenv
          pip install -e ./agenteval
          pip install -e .

      - name: Seed fixtures
        run: python scripts/seed_fixtures.py

      - name: Run security unit tests (no LLM)
        # @slow tests need Ollama — excluded in CI.
        # @security tests call guardrail_check() directly, no LLM needed.
        run: pytest tests/test_security.py -m "security" -v
